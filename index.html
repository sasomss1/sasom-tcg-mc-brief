<!DOCTYPE html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MC Brief — Oripa Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#1B1B1B;--accent:#C9FF00;--accent-text:#1B1B1B;--bg:#FAFAFA;--card:#FFFFFF;--line:#E7E7E7;--line-soft:#F0F0F0;--sub:#8A8A8A;--text:#141414}
:root[data-theme="dark"]{--dark:#EDEDED;--bg:#111111;--card:#1A1A1A;--line:#2C2C2C;--line-soft:#232323;--sub:#8F8F8F;--text:#EDEDED;--accent-text:#1B1B1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dark:#EDEDED;--bg:#111111;--card:#1A1A1A;--line:#2C2C2C;--line-soft:#232323;--sub:#8F8F8F;--text:#EDEDED}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans Thai',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0 14px;flex-wrap:wrap}
.brand{font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--sub)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--sub);font-weight:500;user-select:none}
.knob-track{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .25s cubic-bezier(.4,0,.2,1)}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .25s cubic-bezier(.4,0,.2,1)}
:root[data-theme="dark"] .knob-track{background:var(--accent)}
:root[data-theme="dark"] .knob{transform:translateX(16px)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line-soft)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.primary{background:var(--dark);color:var(--bg);border-color:var(--dark)}
:root[data-theme="dark"] .btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.field{border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;padding:8px 14px;border-radius:999px;min-width:190px}
.field::placeholder{color:var(--sub)}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--sub);font-family:inherit;font-size:12px;font-weight:500;padding:5px 13px;border-radius:999px;cursor:pointer}
.seg button.active{background:var(--accent);color:var(--accent-text);font-weight:600}
.meta{font-size:11px;color:var(--sub);padding-bottom:12px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.pf{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.pf:hover{background:var(--line-soft)}
.pf.on{background:var(--accent);color:var(--accent-text);font-weight:600;border-color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:#2E7D32}
.pf .dot.ON{background:#6B5900}
.pf.on .dot{background:var(--accent-text)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;min-height:430px;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y;overflow:hidden;position:relative}
.stage{cursor:grab}
.stage.dragging{cursor:grabbing;user-select:none}
.stage.dragging *{cursor:grabbing}
.stage .inner{will-change:transform}
.stage .inner.snap{transition:transform .16s cubic-bezier(.4,0,.2,1),opacity .16s ease}
@keyframes inFromRight{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFromLeft{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.stage .inner.enter-next{animation:inFromRight .15s cubic-bezier(.4,0,.2,1)}
.stage .inner.enter-prev{animation:inFromLeft .15s cubic-bezier(.4,0,.2,1)}
.slide{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:start}
@media(max-width:760px){.slide{grid-template-columns:1fr;gap:18px}.stage{padding:20px;min-height:0}}
.shot{width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shot img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.shot span{color:var(--sub);font-size:12px}
.kicker{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kicker:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.headrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slotno{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.grade{background:var(--dark);color:#F2F2F2;font-size:15px;font-weight:700;letter-spacing:.02em;padding:7px 15px;border-radius:999px;white-space:nowrap}
:root[data-theme="dark"] .grade{background:var(--accent);color:var(--accent-text)}
.grade.sealed{background:var(--accent);color:var(--accent-text)}
.cname{font-size:16px;font-weight:600;margin:12px 0 5px;line-height:1.4}
.nick{display:inline-block;font-size:14px;font-weight:600;color:var(--accent-text);background:var(--accent);padding:3px 11px;border-radius:999px;margin-top:8px}
:root[data-theme="dark"] .nick{background:var(--accent);color:var(--accent-text)}
.tags{font-size:12px;color:var(--sub)}
.plabel{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin-top:14px}
.price{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.price small{font-size:12px;font-weight:500;color:var(--sub);margin-left:5px}
.talk{font-size:17px;line-height:1.75;margin-top:18px;padding-left:14px;border-left:3px solid var(--accent)}
.chase{font-size:16px;line-height:1.7;margin-top:16px;padding:14px 16px;background:var(--line-soft);border-radius:12px}
.chase b{font-weight:600;letter-spacing:.09em;font-size:10px;color:var(--sub)}
.chasepics{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.cpic{width:104px}
.cpic img{width:104px;height:140px;object-fit:contain;border-radius:8px;background:var(--line-soft);cursor:zoom-in;display:block}
.cpic .nm{font-size:11px;line-height:1.35;margin-top:6px;color:var(--text)}
.cpic .pr{font-size:11px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:2px}
.cover .badge{font-size:10px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:999px;display:inline-block;margin-bottom:14px}
.badge.NEW{background:#EAF7EA;color:#2E7D32}.badge.ON{background:#FFF6DC;color:#6B5900}
.cover .big{font-size:52px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.cover .facts{display:flex;flex-wrap:wrap;gap:10px 36px;font-size:15px;color:var(--sub);margin-top:24px}
.cover .facts b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.cover .top{font-size:16px;line-height:1.7;margin-top:22px;padding-left:14px;border-left:3px solid var(--accent)}
.script{white-space:pre-wrap;font-size:17px;line-height:1.8}
.empty{text-align:center;color:var(--sub);font-size:14px}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:760px){.guide{grid-template-columns:1fr}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gcard.wide{grid-column:1/-1}
.gcard .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.gcard h4{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin:0;display:flex;align-items:center;gap:8px}
.gcard h4:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.gcard .body{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.gcard textarea{width:100%;min-height:200px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14.5px;line-height:1.7;padding:12px 14px;border-radius:10px;resize:vertical}
.gcard textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gcard .bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.decklayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:980px){.decklayout{grid-template-columns:1fr}}
.deckcol{min-width:0}
.sidecol{position:sticky;top:14px}
@media(max-width:980px){.sidecol{position:static}}
.quickrules{display:grid;grid-template-columns:1fr;gap:12px}
@media(max-width:980px) and (min-width:641px){.quickrules{grid-template-columns:1fr 1fr}}
.qr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.qr h4{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px}
.qr.ok h4{color:#2E7D32}
.qr.no h4{color:#C0392B}
.qr ul{margin:0;padding-left:16px}
.qr li{font-size:13px;line-height:1.55;margin-bottom:7px}
.qr li:last-child{margin-bottom:0}
.qr .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qr .head h4{margin:0}
.qr textarea{width:100%;min-height:150px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.6;padding:11px 13px;border-radius:10px;resize:vertical}
.qr textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.qr .bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
@media(max-width:640px){
  .wrap{padding:0 14px calc(28px + env(safe-area-inset-bottom))}
  .topbar{padding:12px 0 10px;gap:10px}
  .tools{width:100%;gap:8px}
  .field{flex:1;min-width:0}
  .stage{padding:18px;border-radius:16px}
  .cover .big{font-size:34px}
  .slotno{font-size:36px}
  .talk{font-size:16px}
  .script{font-size:16px}
  .btn{padding:10px 18px}
  .track{max-height:60px}
}
.editbar{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.tiny{border:1px dashed var(--line);background:transparent;color:var(--sub);font-family:inherit;font-size:12px;font-weight:500;padding:6px 13px;border-radius:999px;cursor:pointer}
.tiny:hover{border-style:solid;color:var(--text)}
.edlabel{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);margin:16px 0 6px}
textarea.ed{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;line-height:1.7;padding:13px 15px;border-radius:12px;resize:vertical}
textarea.ed:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.ed{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;padding:10px 15px;border-radius:999px}
.dirty{font-size:11px;color:#C0392B;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px}
.counter{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{display:flex;flex-wrap:wrap;gap:4px;flex:1;margin:0 4px;max-height:76px;overflow-y:auto}
.tick{border:1px solid var(--line);background:var(--card);color:var(--sub);font-family:inherit;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tick:hover{background:var(--line-soft);color:var(--text)}
.tick.done{color:var(--text)}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.jump{width:76px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-variant-numeric:tabular-nums;padding:7px 11px;border-radius:999px;text-align:center}
.jump::placeholder{color:var(--sub)}
.hint{font-size:11px;color:var(--sub);text-align:center;margin-top:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dark);color:var(--bg);font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.show{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:24px}
#lb img{max-width:min(560px,90vw);max-height:88vh;border-radius:12px;background:#fff}
</style></head><body>
<div class="wrap">
<div class="topbar">
  <div class="brand">SASOM</div>
  <div class="tools">
    <input class="field" id="q" type="search" placeholder="Search board / card / nickname / SKU" autocomplete="off">
    <div class="seg" id="statusSeg">
      <button data-s="ALL" class="active">All</button>
      <button data-s="NEW">NEW</button>
      <button data-s="ON">ON</button>
    </div>
    <button class="btn primary" id="sync">Sync from Sheet</button>
    <div class="switch" id="themeToggle">Dark<div class="knob-track"><div class="knob"></div></div></div>
  </div>
</div>
<div class="meta" id="meta"></div>
<div class="pills" id="pills"></div>
<div class="decklayout">
  <div class="deckcol">
    <div class="stage" id="stage"></div>
    <div class="nav">
      <button class="btn" id="prev">Prev</button>
      <div class="track" id="track"></div>
      <input class="jump" id="jump" type="text" inputmode="numeric" placeholder="No." autocomplete="off">
      <span class="counter" id="counter"></span>
      <button class="btn" id="next">Next</button>
    </div>
    <div class="hint">Use arrow keys or swipe to navigate</div>
  </div>
  <aside class="sidecol"><div class="quickrules" id="quickrules"></div></aside>
</div>
<div class="guide" id="mcguide"></div>
</div>
<div class="toast" id="toast"></div>
<div id="lb"><img id="lbi" alt=""></div>

<script>
// ── ตั้งค่า ───────────────────────────────────────────────────────────────
// วาง URL ของ Apps Script Web App ที่ deploy จาก Google Sheet ตรงนี้
// ดูวิธี deploy ใน README.md แล้วเอา URL ที่ลงท้ายด้วย /exec มาใส่
var SYNC_URL = "https://script.google.com/macros/s/AKfycbxxLrFpMZOvtgLxVPcGbGKXh4O64x5HZ0P7JgOFh9L0Q2NuPUfSEmJFDIOigHqPfFmz/exec";

var ALL = [], NOTES = {}, BASE_NOTES = {}, LOCAL = {}, view = [], cur = 0, idx = 0,
    slides = [], statusFilter = "ALL", q = "", editing = null;
var LS_KEY = 'mcbrief.notes.v1';
var rulesEditing = null;
var RULE_KEYS = { do: '__rules:do', dont: '__rules:dont' };
var DEFAULT_RULES = {
  do: [
    'ย้ำได้ว่าแท้ 100% ปลอมคืนเงิน 2 เท่า',
    'ซองซีลมาจากที่อื่น SASOM แค่แปะเลข',
    'ถามว่าเหลือ Hit อะไร ชี้ไปหน้า board detail',
    'เลขที่ sold out กลับมาได้ ระบบจองไว้ 3 นาที',
    'Hit 01/02/03 ออก กดโมเมนต์ทุกครั้ง',
    'ใช้คำให้กำลังใจ เช่น "Hit ยังอยู่นะ"'
  ].join('\n'),
  dont: [
    'ห้ามพูดคำว่า "เกลือ" หรือ "เหนียว"',
    'ห้ามกดโมเมนต์ตอนออกเป็นเกลือ',
    'ห้ามบอกใบ้ว่าซองไหนมีอะไร',
    'ห้ามหายไปเฉยๆ ตอนจอดำ ต้องแจ้งก่อน',
    'เสียงไม่ออก ห้ามลงไลฟ์ก่อนพิมพ์ปักหมุด',
    'ห้ามรับปากนอกเหนือจากที่ระบุในบอร์ด'
  ].join('\n')
};
var inner=null;
var pills=document.getElementById('pills'), stage=document.getElementById('stage'),
    track=document.getElementById('track'), counter=document.getElementById('counter'),
    metaEl=document.getElementById('meta'), toastEl=document.getElementById('toast');

var SCRIPTS = [
 ["INTRO","สวัสดีครับ เราอยู่กันในไลฟ์ TCG Oripa Series ไลฟ์สำหรับคนรักการ์ด วันนี้อยู่กับเรา 2 ชั่วโมงเต็ม 20:00–22:00 น.\n\nช้อปกับ SASOM รักจริง ไม่หลอก\nไม่รีซีล ไม่ยัด Pack ไม่บิด ไม่โกง\nช้อปแบบไหน ได้แบบนั้น ถ้าไม่ได้ตามที่บอก คืนเงิน 2 เท่าทั้ง Live"],
 ["HOW TO ORDER","เลือกตัวเลขที่ต้องการ เลือกได้หลายเลขพร้อมกันแล้วค่อยกดสั่งซื้อ\n\nซองและการ์ดด้านในถูกจัดและซีลลายน้ำมาจากที่อื่นก่อนแล้ว SASOM มีหน้าที่แค่แปะตัวเลขหลังซอง จึงไม่มีใครรู้หรือเช็คได้ว่าซองไหนเป็นเลขอะไรจนกว่าจะแกะ"],
 ["Q&A","เหลือ Hit อะไรบ้าง / มีกี่ใบ → ดูได้ในหน้า board detail\n\nเหลือกี่จุ่ม → เช็คในขั้นตอนสั่งซื้อว่าเลขไหน sold out แล้ว หน้านี้เป็น real-time บางครั้งเลขที่ sold out กลับมาได้ เพราะลูกค้าจองแล้วไม่จ่าย ระบบจองไว้ 3 นาที"],

 ["OUTRO","ก็มาถึงช่วงเวลาสุดท้ายของวันนี้แล้ว สนุกมากเลยสำหรับ SASOM TCG Oripa Live\nเจอกันได้ทุกวันจันทร์ พุธ และศุกร์ เวลา 20:00–22:00 น.\n\nย้ำก่อนลา สินค้าทุกชิ้นที่ช้อปผ่าน SASOM การันตีแท้ 100% ถ้าเป็นของปลอม คืนเงิน 2 เท่า\nอยากดู Live แบบนี้อีก กดที่ Live & Feed ด้านล่างแอป แล้วพบกันใหม่ครั้งหน้า"]
];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(v){return (v||v===0)?Number(v).toLocaleString('en-US'):'—';}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(function(){toastEl.classList.remove('show');},2600);}
function noteKey(c){return c.sku || c.name;}
function noteFor(c){return NOTES[c.sku]||NOTES[c.name]||{};}

function loadLocal(){
  try{ LOCAL = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ LOCAL = {}; }
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); }catch(e){}
}
// ลำดับความสำคัญ: notes.json ในรีโป < บทพูดจากชีต < ที่แก้ไว้ในเครื่อง
// ของในเครื่องถูกเก็บไว้ตลอด ไม่ลบทิ้งแม้ส่งขึ้นชีตสำเร็จ กันข้อความหายถ้าชีตล่มตอนเปิดครั้งหน้า
function mergeNotes(serverNotes){
  var syncedLocal={}, draftLocal={};
  Object.keys(LOCAL).forEach(function(k){
    (LOCAL[k].synced===true ? syncedLocal : draftLocal)[k]=LOCAL[k];
  });
  // ชีตคือของกลาง ต้องชนะสำเนาที่เราเคยส่งขึ้นไปแล้ว คนอื่นแก้ทีหลังเราจะได้เห็นของเขา
  // สำเนาที่ซิงก์แล้วเหลือไว้เป็นตัวสำรองเฉยๆ เผื่อดึงชีตไม่ได้
  // ส่วนที่ยังไม่ได้ส่งขึ้นชีต ถือเป็นฉบับร่างของเรา ทับทุกอย่าง
  NOTES = {};
  [BASE_NOTES, syncedLocal, serverNotes||{}, draftLocal].forEach(function(src){
    Object.keys(src||{}).forEach(function(k){
      var e=src[k]||{}, clean={};
      if(e.note)  clean.note=e.note;
      if(e.chase) clean.chase=e.chase;
      NOTES[k] = Object.assign({}, NOTES[k]||{}, clean);
    });
  });
}
function isUnsynced(key){ return !!(LOCAL[key] && LOCAL[key].synced !== true); }
function pendingCount(){ return Object.keys(LOCAL).filter(isUnsynced).length; }

function imgHtml(src){
  if(!src) return '<span>No photo</span>';
  return '<img src="'+esc(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'<span>—</span>\'">';
}
function gradeHtml(c){
  if(!c.cond) return '';
  var sealed=/Booster|Trainer|ETB/i.test(c.cond)?' sealed':'';
  return '<span class="grade'+sealed+'">'+esc(c.cond)+'</span>';
}
// รูปใบที่คนไล่ล่าในกล่องนั้น ดึงจาก CDN เดียวกับรูปการ์ดปกติ
function chasePics(n){
  if(!n.chaseCards || !n.chaseCards.length) return '';
  return '<div class="chasepics">'+n.chaseCards.map(function(c){
    return '<div class="cpic"><img src="'+esc(c.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'+
      '<div class="nm">'+esc(c.name)+'</div>'+
      (c.mkt?'<div class="pr">'+money(c.mkt)+' THB</div>':'')+'</div>';
  }).join('')+'</div>';
}

function priceBlock(c){
  if(c.mkt) return '<div class="plabel">Market price</div><div class="price">'+money(c.mkt)+'<small>THB</small></div>';
  if(c.sheet) return '<div class="plabel">Sheet price</div><div class="price">'+money(c.sheet)+'<small>THB</small></div>';
  return '';
}

function applyFilter(){
  var t=q.trim().toLowerCase();
  view = ALL.filter(function(b){
    if(statusFilter!=='ALL' && b.status!==statusFilter) return false;
    if(!t) return true;
    if(b.board.toLowerCase().indexOf(t)>=0) return true;
    return b.cards.some(function(c){
      return (c.name||'').toLowerCase().indexOf(t)>=0
          || (c.sku||'').toLowerCase().indexOf(t)>=0
          || (c.nick||'').toLowerCase().indexOf(t)>=0;
    });
  });
  cur=0; idx=0; renderPills(); rebuild();
}
function renderPills(){
  pills.innerHTML='';
  view.forEach(function(b,i){
    var el=document.createElement('button');
    el.className='pf'+(i===cur?' on':'');
    el.innerHTML='<span class="dot '+b.status+'"></span>'+esc(b.board);
    el.onclick=function(){cur=i;idx=0;renderPills();build();};
    pills.appendChild(el);
  });
}
function build(){
  if(!view.length){
    slides=[{html:'<div class="empty">No boards match your filter</div>'}];
    return render();
  }
  var b=view[cur]; slides=[];
  var hits=b.cards.filter(function(c){return c.kind==='hit';});
  var top=b.cards.slice().sort(function(a,c){return (c.mkt||c.sheet||0)-(a.mkt||a.sheet||0);})[0];
  slides.push({html:'<div class="cover"><span class="badge '+b.status+'">'+b.status+'</span>'+
    '<div class="big">'+esc(b.board)+'</div>'+
    '<div class="facts"><span>Per pull <b>'+esc(b.price)+'</b></span>'+
    '<span>Slots <b>'+b.slots+'</b></span><span>Hits <b>'+hits.length+'</b></span>'+
    (b.date?'<span>Schedule <b>'+esc(b.date)+'</b></span>':'')+'</div>'+
    (top?'<div class="top">Top hit: '+esc(String(top.name).split('[')[0].trim())+' — '+money(top.mkt||top.sheet)+' THB</div>':'')+
    '</div>'});
  b.cards.forEach(function(c){
    var tags=[c.rar,c.set?('SET '+c.set):'',c.lang].filter(Boolean).join(' · ');
    slides.push({card:c, head:
      '<div class="kicker">Slot</div>'+
      '<div class="headrow"><span class="slotno">'+esc(c.slot)+'</span>'+gradeHtml(c)+'</div>'+
      (c.nick?'<div class="nick">'+esc(c.nick)+'</div>':'')+
      '<div class="cname">'+esc(c.name)+'</div>'+
      (tags?'<div class="tags">'+esc(tags)+'</div>':'')+
      (c.remark?'<div class="tags">'+esc(c.remark)+'</div>':'')+
      priceBlock(c)});
  });
  render();
}
function rebuild(){ build(); }

function scriptBody(s){

  if(editing===key){
    return '<div class="kicker">'+esc(s[0])+'</div>'+

function render(dir){
  var s=slides[idx];
  var body = s.card
    ? '<div class="slide"><div class="shot">'+imgHtml(s.card.img)+'</div><div>'+s.head+cardBody(s.card)+'</div></div>'
    : (s.script ? '<div>'+scriptBody(s.script)+'</div>' : s.html);
  stage.innerHTML = '<div class="inner'+(dir===1?' enter-next':(dir===-1?' enter-prev':''))+'">'+body+'</div>';
  inner = stage.firstChild;
  wireEditors();
  counter.textContent=(idx+1)+' / '+slides.length;
  track.innerHTML=slides.map(function(s,i){
    var label = s.card ? s.card.slot : (s.script ? s.script[0].split(' ')[0] : 'BOARD');
    return '<button class="tick '+(i===idx?'on':(i<idx?'done':''))+'" data-i="'+i+'" title="'+esc(s.card?s.card.name:label)+'">'+esc(label)+'</button>';
  }).join('');
  var on=track.querySelector('.tick.on');
  if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'});
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===slides.length-1;
}
function go(d){var n=idx+d; if(n<0||n>=slides.length) return false; idx=n; render(d>0?1:-1); return true;}

// พิมพ์เลขซองแล้วกระโดดไปสไลด์นั้น รองรับทั้งเลขเดี่ยวและช่วงเลข เช่น 13–19
function jumpTo(num){
  var n=parseInt(num,10);
  if(isNaN(n)) return false;
  for(var i=0;i<slides.length;i++){
    var c=slides[i].card; if(!c) continue;
    var m=String(c.slot).match(/(\d+)\s*[–-]\s*(\d+)/);
    if(m){ if(n>=+m[1]&&n<=+m[2]){ idx=i; render(); return true; } }
    else if(parseInt(c.slot,10)===n){ idx=i; render(); return true; }
  }
  return false;
}

function setData(payload, source){
  ALL = payload.boards || [];
  var rank={NEW:0,ON:1};
  ALL.sort(function(a,b){
    var r=(rank[a.status]===undefined?9:rank[a.status])-(rank[b.status]===undefined?9:rank[b.status]);
    if(r) return r;
    return (parseFloat(String(b.price).replace(/,/g,''))||0)-(parseFloat(String(a.price).replace(/,/g,''))||0);
  });
  mergeNotes(payload.notes);
  var pending=pendingCount();
  metaEl.textContent = ALL.length+' boards · data '+(payload.synced_at||'unknown date')+' · '+source+
    (pending?' · '+pending+' unsynced edit'+(pending>1?'s':''):'');
  applyFilter();
  renderScripts();
  renderRules();
}

async function loadCache(){
  var [b,n] = await Promise.all([
    fetch('data/boards.json',{cache:'no-store'}).then(function(r){return r.json();}),
    fetch('data/notes.json',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return {};})
  ]);
  BASE_NOTES = n;
  setData(b, 'from repo file');
}
async function doSync(silent){
  var btn=document.getElementById('sync');
  if(!SYNC_URL){ if(!silent) toast('SYNC_URL is not set in index.html'); return; }
  btn.disabled=true; btn.textContent='Syncing…';
  try{
    var r = await fetch(SYNC_URL, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var payload = await r.json();
    if(!payload.boards) throw new Error('unexpected response format');
    setData(payload, 'live from Sheet');
    if(!silent) toast('Synced · '+payload.boards.length+' boards');
  }catch(e){
    if(!silent) toast('Sync failed: '+e.message);
    else console.warn('auto-sync failed:', e.message);
  }finally{
    btn.disabled=false; btn.textContent='Sync from Sheet';
  }
}

// เซฟบทพูด/กฎ ลงเครื่องก่อนเสมอ แล้วค่อยพยายามส่งขึ้นชีต
async function saveEntry(key, note, chase, msgEl, btn){
  var entry={}; if(note) entry.note=note; if(chase) entry.chase=chase;
  NOTES[key]=entry;
  LOCAL[key]=Object.assign({}, entry, {synced:false});
  saveLocal();

  if(!SYNC_URL){ toast('Saved on this device only — SYNC_URL is not set'); return; }
  if(btn) btn.disabled=true;
  if(msgEl) msgEl.textContent='Saving to Sheet…';
  try{
    var r=await fetch(SYNC_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({key:key,note:note,chase:chase,by:''})
    });
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'unknown error');
    LOCAL[key].synced=true; saveLocal();      // เก็บไว้ในเครื่องต่อ แค่เลิกขึ้นป้าย Not synced
    toast('Saved to Sheet');
  }catch(e){
    toast('Saved locally, but could not reach the Sheet: '+e.message);
  }finally{ if(btn) btn.disabled=false; }
}

function wireEditors(){
  var btn=stage.querySelector('[data-edit]');
  if(btn) btn.onclick=function(){ editing=this.dataset.edit; render(); };

  var save=document.getElementById('edSave');
  if(!save) return;
  document.getElementById('edCancel').onclick=function(){ editing=null; render(); };
  save.onclick=async function(){
    var key=editing;
    var note=document.getElementById('edNote').value.trim();
    var chase=document.getElementById('edChase').value.trim();
    await saveEntry(key, note, chase, document.getElementById('edMsg'), save);
    editing=null; render();
  };
}

// ปัดนิ้วเปลี่ยนสไลด์ — ลากแล้วสไลด์ขยับตามนิ้วจริง ปล่อยแล้วค่อยตัดสินว่าจะเปลี่ยนหรือเด้งกลับ
var sx=null, sy=null, dxNow=0, axis=null;
var W=function(){ return stage.offsetWidth || 320; };

stage.addEventListener('touchstart',function(e){
  if(e.touches.length>1) return;
  if(e.target.closest('textarea,input,button,a')) return;   // กำลังแก้ข้อความอยู่ อย่าไปปัด
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; dxNow=0; axis=null;
  if(inner) inner.classList.remove('snap');
},{passive:true});

stage.addEventListener('touchmove',function(e){
  if(sx===null||!inner) return;
  var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
  if(axis===null){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(axis==='y'){ sx=null; return; }                        // เลื่อนหน้าขึ้นลงตามปกติ
  e.preventDefault();                                        // กันหน้าเลื่อนไปมาระหว่างปัด
  // ถึงหัวหรือท้ายแล้วให้หนืด ๆ ไม่ให้ลากหลุดออกไป
  var edge = (dx>0 && idx===0) || (dx<0 && idx===slides.length-1);
  dxNow = edge ? dx*0.25 : dx;
  inner.style.transform='translateX('+dxNow+'px)';
  inner.style.opacity = String(Math.max(0.45, 1-Math.abs(dxNow)/(W()*1.4)));
},{passive:false});

// เคลียร์สถานะลากทุกอย่างให้กลับเป็นศูนย์ ไม่ว่าจบยังไง
function resetDrag(){
  if(inner){
    inner.classList.add('snap');
    inner.style.transform='';
    inner.style.opacity='';
  }
  sx=null; sy=null; dxNow=0; axis=null; mDown=false;
  stage.classList.remove('dragging');
}

function endDrag(){
  if(sx===null||!inner){ resetDrag(); return; }
  var moved=dxNow;
  var threshold = Math.min(60, W()*0.12);
  resetDrag();
  if(Math.abs(moved)>threshold) go(moved<0?1:-1);
}
stage.addEventListener('touchend',endDrag,{passive:true});
stage.addEventListener('touchcancel',endDrag,{passive:true});

// ปัดสองนิ้วบนแทร็กแพด — macOS ส่งมาเป็น wheel แนวนอน (deltaX)
// ผูกไว้ที่ทั้งหน้า ไม่ใช่เฉพาะกรอบสไลด์ จะได้ไม่ต้องเอาเมาส์ไปจ่อหรือคลิกก่อน
//
// กติกาเดียว: หนึ่งท่า = หนึ่งสไลด์
// นับว่า "จบท่า" เมื่อไม่มี event เข้ามาเลยติดกัน 90ms
// ปัดทีนึง macOS จะยิงหางโมเมนตัมต่อเนื่องไม่ขาดสาย (ห่างกันไม่ถึง 20ms)
// ทั้งชุดจึงถูกนับเป็นท่าเดียว ส่วนการปัดครั้งใหม่คนจะยกนิ้วก่อน มีช่องว่างเกิน 90ms เสมอ
// ยกเว้นทางเดียวคือปัดกลับทิศแรงๆ ระหว่างหางเก่ายังอยู่ อันนั้นรับทันที
var wheelAcc=0, wheelLocked=false, wheelIdle=null, lastFire=0, lastDir=0;

function wheelUnlock(){ wheelLocked=false; wheelAcc=0; lastDir=0; }

window.addEventListener('wheel',function(e){
  if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // เลื่อนขึ้นลง ปล่อยให้หน้าสกรอลตามปกติ
  var t=e.target;
  if(t && t.closest && t.closest('textarea,input,.track')) return;
  e.preventDefault();

  var now=Date.now(), a=Math.abs(e.deltaX), dir=e.deltaX>0?1:-1;

  // นับถอยหลังใหม่ทุก event ที่เข้ามา เงียบครบ 90ms เมื่อไหร่ถือว่าจบท่า
  clearTimeout(wheelIdle);
  wheelIdle=setTimeout(wheelUnlock, 90);

  if(wheelLocked){
    // ปัดสวนทางแรงๆ ระหว่างหางเก่ายังไม่หมด = ตั้งใจย้อนกลับ รับเลย
    if(lastDir && dir!==lastDir && a>=20 && now-lastFire>100){ wheelAcc=0; }
    else return;
  }

  wheelAcc += e.deltaX;
  if(a < 18 && Math.abs(wheelAcc) < 14) return;

  go(wheelAcc>0 ? 1 : -1);      // ปัดซ้าย (นิ้วไปทางซ้าย) = ไปสไลด์ถัดไป
  lastFire=now; lastDir=dir; wheelAcc=0; wheelLocked=true;
},{passive:false});

// ลากด้วยเมาส์บนเดสก์ท็อป — ใช้ Pointer Events + setPointerCapture
// ของเดิมรอ mouseup ธรรมดา ถ้าปล่อยตอนเบราว์เซอร์เริ่ม native drag หรือปล่อยนอกหน้าต่าง
// จะไม่มี event กลับมา สไลด์เลยค้างเอียงอยู่อย่างนั้น
var mDown=false, pid=null;

stage.addEventListener('pointerdown',function(e){
  if(e.pointerType!=='mouse' || e.button!==0) return;
  if(e.target.closest('textarea,input,button,a')) return;
  if(window.getSelection && String(window.getSelection())) return;   // กำลังลากเลือกข้อความอยู่
  mDown=true; pid=e.pointerId; sx=e.clientX; sy=e.clientY; dxNow=0; axis=null;
  stage.classList.add('dragging');
  if(inner) inner.classList.remove('snap');
  try{ stage.setPointerCapture(pid); }catch(err){}
});

stage.addEventListener('pointermove',function(e){
  if(!mDown || e.pointerId!==pid || sx===null || !inner) return;
  var dx=e.clientX-sx, dy=e.clientY-sy;
  if(axis===null){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(axis==='y'){ resetDrag(); return; }
  e.preventDefault();
  var edge=(dx>0 && idx===0)||(dx<0 && idx===slides.length-1);
  dxNow = edge ? dx*0.25 : dx;
  inner.style.transform='translateX('+dxNow+'px)';
  inner.style.opacity = String(Math.max(0.45, 1-Math.abs(dxNow)/(W()*1.4)));
});

function finishPointer(e){
  if(!mDown) return;
  if(e && e.pointerId!==undefined && e.pointerId!==pid) return;
  var moved=dxNow;
  try{ stage.releasePointerCapture(pid); }catch(err){}
  resetDrag();
  var threshold=Math.min(60, W()*0.12);
  if(Math.abs(moved)>threshold) go(moved<0?1:-1);
}
stage.addEventListener('pointerup',finishPointer);
stage.addEventListener('pointercancel',finishPointer);
stage.addEventListener('lostpointercapture',finishPointer);

// กันเหนียว ถ้าหลุดทุกทางแล้วยังค้าง ให้เคลียร์ทิ้ง
window.addEventListener('blur',function(){ if(mDown) resetDrag(); });
document.addEventListener('mouseup',function(){ if(mDown) finishPointer(null); });
document.getElementById('themeToggle').addEventListener('click',function(){
  var d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
});
var lb=document.getElementById('lb'), lbi=document.getElementById('lbi');
document.addEventListener('click',function(e){
  if(e.target.tagName==='IMG'&&(e.target.closest('.shot')||e.target.closest('.cpic'))){lbi.src=e.target.src;lb.style.display='flex';}
  else if(e.target.closest('#lb')){lb.style.display='none';}
});

loadLocal();
mergeNotes(null);     // เอาที่แก้ไว้ในเครื่องขึ้นให้เห็นทันที ไม่ต้องรอโหลดข้อมูล
renderScripts();
renderRules();
loadCache().then(function(){
  // เปิดหน้ามาก็ดึงสดจากชีตให้เลย ไม่ต้องรอใครกดปุ่ม
  // ไฟล์ในรีโปทำหน้าที่แค่ให้หน้าขึ้นทันทีระหว่างรอ และเป็นตัวสำรองตอน sync ไม่ได้
  if(SYNC_URL) doSync(true);
}).catch(function(e){
  stage.innerHTML='<div class="empty">Could not load data: '+esc(e.message)+'</div>';
});
</script>
